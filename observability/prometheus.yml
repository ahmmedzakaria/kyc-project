global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: nexacore-backend
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - nexacore-backend:9100

  - job_name: otel-collector
    static_configs:
      - targets:
          - otel-collector:8889
